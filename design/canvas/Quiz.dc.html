<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then Again: Quiz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#141210}a:hover{color:#2340C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #141210; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 10px">
    <a href="Library.dc.html" aria-label="Back to the library" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #141210; display: grid; place-items: center; text-decoration: none; font-size: 20px; font-weight: 700">←</a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">TRIVIA · Nº 023</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.02em">The Quiz</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; background: #BFAEF5; border-radius: 10px; padding: 6px 10px">{{scoreLine}}</span>
  </div>
  <div role="img" aria-label="{{progressLabel}}" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding: 0 16px 14px">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
      <span style="height: 10px; border-radius: 5px; background: {{d.bg}}; border: 2px solid {{d.edge}}; box-sizing: border-box"></span>
    </sc-for>
  </div>
  <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
    <div style="margin: 0 16px; border-radius: 20px; background: #141210; color: #F7F6F2; padding: 20px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #BFAEF5">QUESTION {{qNum}} OF 5</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1">{{question}}</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 0">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
        <button onClick="{{o.pick}}" style="min-height: 56px; border-radius: 14px; border: 2px solid {{o.edge}}; background: {{o.bg}}; color: {{o.fg}}; font-family: Figtree, sans-serif; font-weight: 700; font-size: 17px; text-align: left; padding: 0 16px; cursor: pointer">{{o.mark}}{{o.label}}</button>
      </sc-for>
    </div>
    <div aria-live="polite" style="min-height: 22px; padding: 12px 20px 0; font-size: 15px; line-height: 1.4">{{fact}}</div>
    <sc-if value="{{answered}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{next}}" style="margin: auto 16px 16px; min-height: 54px; border-radius: 14px; border: 0; background: #141210; color: #F7F6F2; font-family: Figtree, sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">{{nextLabel}}</button>
    </sc-if>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="margin: 0 16px; border-radius: 20px; background: #BFAEF5; padding: 22px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em">TODAY’S QUIZ</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 56px; line-height: 1">{{final}}</span>
      <span style="font-size: 17px">{{finalLine}}</span>
      <a href="Collection.dc.html" style="min-height: 50px; border-radius: 12px; background: #141210; color: #F7F6F2; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">See my collection →</a>
    </div>
    <div style="margin: 14px 16px 0; border-radius: 16px; border: 2px dashed #8A857D; padding: 14px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #55504A">ADVERTISEMENT</span>
      <div style="min-height: 96px; border-radius: 10px; background: #E9E6DF; display: grid; place-items: center; font-size: 14px; color: #55504A; text-align: center; padding: 8px">Ad space: shown only on results screens, never during a puzzle</div>
      <a href="Gems.dc.html" style="font-size: 14px; font-weight: 700">Remove ads with Then Again Plus →</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 0, picked: null, results: [] };
  }
  renderVals() {
    const QS = [
      { q: 'How many keys does a standard modern piano have?', o: ['76', '88', '92', '100'], a: 1, f: '52 white keys and 36 black ones.' },
      { q: 'Before streaming, which machine played VHS tapes at home?', o: ['Record player', 'Video recorder', 'Slide projector', 'Fax machine'], a: 1, f: 'The video recorder, often blinking 12:00 because nobody set its clock.' },
      { q: 'Which planet is closest to the Sun?', o: ['Venus', 'Mars', 'Mercury', 'Earth'], a: 2, f: 'Mercury, which takes just 88 days to go round the Sun.' },
      { q: 'On a clock face, which number sits directly opposite the 12?', o: ['3', '6', '9', '10'], a: 1, f: 'The 6, at the bottom of the dial.' },
      { q: 'Mixing blue and yellow paint makes which colour?', o: ['Purple', 'Orange', 'Green', 'Brown'], a: 2, f: 'Green, as every primary school painting table proved.' }
    ];
    const s = this.state;
    const done = s.q >= QS.length;
    const cur = QS[Math.min(s.q, QS.length - 1)];
    const answered = s.picked !== null;
    const score = s.results.filter(Boolean).length;
    const options = cur.o.map((label, i) => {
      const isAns = i === cur.a, isPick = i === s.picked;
      const look = !answered ? ['#FFFFFF', '#141210', '#141210', ''] : isAns ? ['#D9EC4C', '#141210', '#141210', '✓ '] : isPick ? ['#E9E6DF', '#8A857D', '#B3261E', '× '] : ['#FFFFFF', '#8A857D', '#D8D5CE', ''];
      return { label: label, bg: look[0], fg: look[1], edge: look[2], mark: look[3], pick: () => { if (!answered) this.setState({ picked: i, results: s.results.concat([i === cur.a]) }); } };
    });
    const dots = QS.map((_, i) => {
      const r = s.results[i];
      return { bg: r === true ? '#141210' : r === false ? '#E9E6DF' : 'transparent', edge: i === s.q && !done ? '#141210' : r === undefined ? '#CFCBC2' : '#141210' };
    });
    return {
      done: done, playing: !done, answered: answered,
      qNum: String(Math.min(s.q + 1, 5)), question: cur.q, options: options, dots: dots,
      fact: answered ? (s.picked === cur.a ? 'Right. ' : 'Not quite. ') + cur.f : '',
      nextLabel: s.q === QS.length - 1 ? 'See my score' : 'Next question →',
      scoreLine: score + '/5',
      progressLabel: 'Question ' + Math.min(s.q + 1, 5) + ' of 5, ' + score + ' correct',
      final: score + '/5',
      finalLine: score === 5 ? 'A perfect round.' : score >= 3 ? 'A strong round. Come back tomorrow for five more.' : 'Five new questions tomorrow.',
      next: () => this.setState({ q: s.q + 1, picked: null })
    };
  }
}
</script>
</body>
</html>
