<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then Again: Word Hive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#141210}a:hover{color:#2340C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #141210; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 10px">
    <a href="Library.dc.html" aria-label="Back to the library" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #141210; display: grid; place-items: center; text-decoration: none; font-size: 20px; font-weight: 700">←</a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">WORD GAMES · Nº 023</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.02em">Word Hive</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; background: #E8552B; border-radius: 10px; padding: 6px 10px">{{rank}}</span>
  </div>
  <p style="margin: 0 20px 8px; font-size: 15px; color: #55504A; line-height: 1.4">Make words of four letters or more. Every word must use the centre A. Letters can repeat. One word uses all seven.</p>
  <div role="img" aria-label="{{meterLabel}}" style="margin: 4px 16px 0; height: 10px; border-radius: 5px; background: #E9E6DF; overflow: hidden"><div style="height: 100%; width: {{meter}}; background: #E8552B"></div></div>
  <div aria-live="polite" style="margin: 12px 16px 0; min-height: 52px; border-bottom: 3px solid #141210; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 28px; letter-spacing: 0.12em">{{current}}</div>
  <div style="position: relative; width: 240px; height: 230px; margin: 14px auto 0">
    <sc-for list="{{hexes}}" as="h" hint-placeholder-count="7">
      <button onClick="{{h.tap}}" aria-label="{{h.label}}" style="position: absolute; left: {{h.x}}; top: {{h.y}}; width: 72px; height: 72px; margin: -36px 0 0 -36px; border: 0; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); background: {{h.bg}}; color: #141210; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; cursor: pointer">{{h.ch}}</button>
    </sc-for>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px 16px 0">
    <button onClick="{{del}}" style="min-height: 50px; border-radius: 12px; border: 2px solid #141210; background: transparent; color: #141210; font-family: Figtree, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">Delete</button>
    <button onClick="{{spin}}" style="min-height: 50px; border-radius: 12px; border: 2px solid #141210; background: transparent; color: #141210; font-family: Figtree, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">Shuffle</button>
    <button onClick="{{enter}}" style="min-height: 50px; border-radius: 12px; border: 0; background: #141210; color: #F7F6F2; font-family: Figtree, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">Enter</button>
  </div>
  <div aria-live="polite" style="min-height: 22px; padding: 10px 20px 0; font-size: 15px; font-weight: 600; text-align: center">{{message}}</div>
  <div style="margin: 8px 16px 16px; border-radius: 14px; border: 2px solid #141210; padding: 10px 12px; min-height: 80px; overflow-y: auto">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">{{foundLine}}</span>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px">
      <sc-for list="{{found}}" as="f" hint-placeholder-count="4">
        <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; padding: 2px 8px; border-radius: 8px; background: {{f.bg}}">{{f.w}}</span>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { word: '', found: [], ring: ['T', 'E', 'C', 'U', 'P', 'S'], note: '' };
  }
  renderVals() {
    const CENTRE = 'A';
    const VALID = ['TEACUP', 'TEACUPS', 'CAPE', 'CAPES', 'PACE', 'PACES', 'SPACE', 'PACT', 'PACTS', 'CAST', 'CATS', 'SCAT', 'ACTS', 'CASE', 'CAUSE', 'SAUCE', 'PASTE', 'PATE', 'PEAT', 'TAPE', 'TAPES', 'SEAT', 'EAST', 'EATS', 'SATE', 'TEAS', 'CAPS', 'PATS', 'PAST', 'SPAT', 'TAPS', 'SPATE', 'CASTE', 'APSE', 'PEAS', 'APES', 'SEPTA', 'CAUSES'];
    const s = this.state;
    const pos = [[120, 115]].concat([0, 1, 2, 3, 4, 5].map((k) => { const a = Math.PI / 6 + k * Math.PI / 3; return [120 + 76 * Math.cos(a - Math.PI / 2 + Math.PI / 6), 115 + 76 * Math.sin(a - Math.PI / 2 + Math.PI / 6)]; }));
    const letters = [CENTRE].concat(s.ring);
    const hexes = letters.map((ch, k) => ({ ch: ch, x: pos[k][0] + 'px', y: pos[k][1] + 'px', bg: k === 0 ? '#E8552B' : '#E9E6DF', label: ch + (k === 0 ? ', centre letter, required' : ''),
      tap: () => this.setState({ word: s.word + ch, note: '' }) }));
    const total = VALID.length;
    const n = s.found.length;
    const pct = n / total;
    const rank = pct >= 0.7 ? 'GENIUS' : pct >= 0.45 ? 'EXPERT' : pct >= 0.25 ? 'SKILLED' : pct >= 0.1 ? 'GOOD' : 'STARTER';
    return {
      hexes: hexes, rank: rank,
      current: s.word || ' ',
      message: s.note,
      meter: Math.round(pct * 100) + '%',
      meterLabel: n + ' of ' + total + ' words found',
      foundLine: n + ' OF ' + total + ' WORDS',
      found: s.found.map((w) => ({ w: w, bg: w === 'TEACUPS' ? '#D9EC4C' : '#E9E6DF' })),
      del: () => this.setState({ word: s.word.slice(0, -1), note: '' }),
      spin: () => { const r = s.ring.slice(); r.push(r.shift()); r.reverse(); this.setState({ ring: r }); },
      enter: () => {
        const w = s.word;
        if (w.length < 4) return this.setState({ word: '', note: 'Too short. Four letters or more.' });
        if (!w.includes(CENTRE)) return this.setState({ word: '', note: 'Every word needs the centre A.' });
        if (s.found.includes(w)) return this.setState({ word: '', note: 'Already found.' });
        if (!VALID.includes(w)) return this.setState({ word: '', note: 'Not in today’s word list.' });
        this.setState({ word: '', found: s.found.concat([w]), note: w === 'TEACUPS' ? 'TEACUPS uses every letter!' : 'Nice: ' + w + '.' });
      }
    };
  }
}
</script>
</body>
</html>
