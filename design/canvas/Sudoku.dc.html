<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then Again: Sudoku</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#141210}a:hover{color:#2340C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #141210; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 10px">
    <a href="Main.dc.html" aria-label="Back to today" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #141210; display: grid; place-items: center; text-decoration: none; font-size: 20px; font-weight: 700">←</a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">NUMBERS &amp; LOGIC · Nº 023</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.02em">Sudoku</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; background: #2340C4; color: #FFFFFF; border-radius: 10px; padding: 6px 10px">{{leftLine}}</span>
  </div>
  <p style="margin: 0 20px 12px; font-size: 15px; color: #55504A; line-height: 1.4">Fill every row, column and 3×3 box with 1 to 9. Tap a square, then a number.</p>
  <div role="grid" aria-label="Sudoku grid" style="margin: 0 16px; border: 3px solid #141210; border-radius: 10px; overflow: hidden; background: #FFFFFF; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr))">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="81">
      <button onClick="{{c.tap}}" aria-label="{{c.label}}" style="aspect-ratio: 1; border: 0; border-right: {{c.br}}; border-bottom: {{c.bb}}; background: {{c.bg}}; color: {{c.fg}}; font-family: 'IBM Plex Mono', monospace; font-weight: {{c.weight}}; font-size: 20px; padding: 0; cursor: pointer; text-decoration: {{c.deco}}">{{c.v}}</button>
    </sc-for>
  </div>
  <div aria-live="polite" style="min-height: 24px; padding: 10px 20px 0; font-size: 15px; font-weight: 600">{{message}}</div>
  <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{pad}}" as="p" hint-placeholder-count="10">
          <button onClick="{{p.press}}" aria-label="{{p.label}}" style="min-height: 52px; border-radius: 12px; border: 2px solid #141210; background: #FFFFFF; color: #141210; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 20px; cursor: pointer">{{p.text}}</button>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button onClick="{{hint}}" style="min-height: 52px; border-radius: 12px; border: 2px solid #141210; background: transparent; color: #141210; font-family: Figtree, sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">Hint</button>
        <button onClick="{{check}}" style="min-height: 52px; border-radius: 12px; border: 0; background: #2340C4; color: #FFFFFF; font-family: Figtree, sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">Check my grid</button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="margin: auto 16px 16px; border-radius: 18px; background: #2340C4; color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em">GRID COMPLETE</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.05">Every number in its place.</span>
      <a href="Rewind.dc.html" style="min-height: 50px; border-radius: 12px; background: #D9EC4C; color: #141210; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">Next: Rewind →</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const PUZ = '067213004900056000002000006380047652009000000005108497700021030800400201210389005';
    this.state = { v: PUZ.split('').map(Number), sel: null, wrong: [], note: '' };
  }
  renderVals() {
    const PUZ = '067213004900056000002000006380047652009000000005108497700021030800400201210389005'.split('').map(Number);
    const SOL = '567213984948756123132894576381947652479562318625138497754621839893475261216389745'.split('').map(Number);
    const s = this.state;
    const done = s.v.every((x, i) => x === SOL[i]);
    const selVal = s.sel !== null ? s.v[s.sel] : 0;
    const peer = (i) => s.sel !== null && (Math.floor(i / 9) === Math.floor(s.sel / 9) || i % 9 === s.sel % 9 || (Math.floor(i / 27) === Math.floor(s.sel / 27) && Math.floor((i % 9) / 3) === Math.floor((s.sel % 9) / 3)));
    const cells = s.v.map((x, i) => {
      const given = PUZ[i] !== 0, r = Math.floor(i / 9), c = i % 9;
      const sel = s.sel === i, wrong = s.wrong.includes(i);
      const same = !sel && selVal && x === selVal;
      return {
        v: x || '', tap: () => this.setState({ sel: i, note: '' }),
        bg: sel ? '#D9EC4C' : same ? '#C9D3F6' : peer(i) ? '#EEF0F8' : '#FFFFFF',
        fg: given ? '#141210' : wrong ? '#B3261E' : '#2340C4',
        weight: given ? '600' : '700',
        deco: wrong ? 'underline wavy #B3261E' : 'none',
        br: c === 8 ? '0' : (c % 3 === 2 ? '3px solid #141210' : '1px solid #D8D5CE'),
        bb: r === 8 ? '0' : (r % 3 === 2 ? '3px solid #141210' : '1px solid #D8D5CE'),
        label: 'Row ' + (r + 1) + ', column ' + (c + 1) + ', ' + (x || 'empty') + (given ? ', given' : '') + (wrong ? ', incorrect' : '')
      };
    });
    const put = (n) => () => {
      if (s.sel === null) return this.setState({ note: 'Tap a square first.' });
      if (PUZ[s.sel] !== 0) return this.setState({ note: 'That number is part of the puzzle.' });
      const v = s.v.slice(); v[s.sel] = n;
      this.setState({ v: v, wrong: s.wrong.filter((w) => w !== s.sel), note: '' });
    };
    const pad = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({ text: String(n), label: 'Enter ' + n, press: put(n) })).concat([{ text: '⌫', label: 'Erase', press: put(0) }]);
    const left = s.v.filter((x) => !x).length;
    return {
      cells: cells, pad: pad, done: done, playing: !done,
      leftLine: left + ' LEFT',
      message: s.note,
      check: () => {
        const wrong = s.v.map((x, i) => (x && x !== SOL[i] ? i : -1)).filter((i) => i >= 0);
        this.setState({ wrong: wrong, note: wrong.length ? wrong.length + (wrong.length === 1 ? ' number doesn’t' : ' numbers don’t') + ' fit. They’re underlined.' : 'Everything so far is right. ' + left + ' to go.' });
      },
      hint: () => {
        let i = s.sel;
        if (i === null || PUZ[i] !== 0 || s.v[i] === SOL[i]) i = s.v.findIndex((x, k) => x !== SOL[k]);
        if (i < 0) return;
        const v = s.v.slice(); v[i] = SOL[i];
        this.setState({ v: v, sel: i, wrong: s.wrong.filter((w) => w !== i), note: 'Hint: one square filled in for you.' });
      }
    };
  }
}
</script>
</body>
</html>
