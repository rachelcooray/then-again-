<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then Again: Mini Sudoku</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#141210}a:hover{color:#2340C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #141210; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 10px">
    <a href="Library.dc.html" aria-label="Back to the library" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #141210; display: grid; place-items: center; text-decoration: none; font-size: 20px; font-weight: 700">←</a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">NUMBERS &amp; LOGIC · Nº 023</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.02em">Mini Sudoku</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; background: #2340C4; color: #FFFFFF; border-radius: 10px; padding: 6px 10px">4×4</span>
  </div>
  <p style="margin: 0 20px 16px; font-size: 15px; color: #55504A; line-height: 1.4">A quick one. Fill every row, column and 2×2 box with 1, 2, 3 and 4.</p>
  <div role="grid" aria-label="Mini Sudoku grid" style="width: 300px; margin: 0 auto; border: 3px solid #141210; border-radius: 12px; overflow: hidden; background: #FFFFFF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="16">
      <button onClick="{{c.tap}}" aria-label="{{c.label}}" style="aspect-ratio: 1; border: 0; border-right: {{c.br}}; border-bottom: {{c.bb}}; background: {{c.bg}}; color: {{c.fg}}; font-family: 'IBM Plex Mono', monospace; font-weight: {{c.weight}}; font-size: 34px; padding: 0; cursor: pointer; text-decoration: {{c.deco}}">{{c.v}}</button>
    </sc-for>
  </div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 20px 16px 0">
    <sc-for list="{{pad}}" as="p" hint-placeholder-count="5">
      <button onClick="{{p.press}}" aria-label="{{p.label}}" style="min-height: 60px; border-radius: 14px; border: 2px solid #141210; background: #FFFFFF; color: #141210; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 24px; cursor: pointer">{{p.text}}</button>
    </sc-for>
  </div>
  <div aria-live="polite" style="min-height: 22px; padding: 14px 20px 0; font-size: 15px; font-weight: 600; text-align: center">{{message}}</div>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="margin: auto 16px 16px; border-radius: 18px; background: #2340C4; color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.05">Solved. Ready for the big one?</span>
      <a href="Sudoku.dc.html" style="min-height: 50px; border-radius: 12px; background: #D9EC4C; color: #141210; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">Try the 9×9 Sudoku →</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: [1, 0, 0, 4, 0, 4, 1, 0, 2, 0, 0, 3, 0, 3, 2, 0], sel: null, note: '' };
  }
  renderVals() {
    const PUZ = [1, 0, 0, 4, 0, 4, 1, 0, 2, 0, 0, 3, 0, 3, 2, 0];
    const SOL = [1, 2, 3, 4, 3, 4, 1, 2, 2, 1, 4, 3, 4, 3, 2, 1];
    const s = this.state;
    const done = s.v.every((x, i) => x === SOL[i]);
    const conflict = (i) => {
      const x = s.v[i]; if (!x) return false;
      const r = Math.floor(i / 4), c = i % 4;
      for (let k = 0; k < 16; k++) {
        if (k === i || s.v[k] !== x) continue;
        const r2 = Math.floor(k / 4), c2 = k % 4;
        if (r2 === r || c2 === c || (Math.floor(r2 / 2) === Math.floor(r / 2) && Math.floor(c2 / 2) === Math.floor(c / 2))) return true;
      }
      return false;
    };
    const cells = s.v.map((x, i) => {
      const given = PUZ[i] !== 0, r = Math.floor(i / 4), c = i % 4, bad = conflict(i) && !given;
      return {
        v: x || '', tap: () => this.setState({ sel: i, note: '' }),
        bg: s.sel === i ? '#D9EC4C' : done ? '#E7ECFB' : '#FFFFFF',
        fg: given ? '#141210' : bad ? '#B3261E' : '#2340C4', weight: given ? '600' : '700',
        deco: bad ? 'underline wavy #B3261E' : 'none',
        br: c === 3 ? '0' : (c === 1 ? '3px solid #141210' : '1px solid #D8D5CE'),
        bb: r === 3 ? '0' : (r === 1 ? '3px solid #141210' : '1px solid #D8D5CE'),
        label: 'Row ' + (r + 1) + ', column ' + (c + 1) + ', ' + (x || 'empty') + (given ? ', given' : '') + (bad ? ', clashes with another' : '')
      };
    });
    const put = (n) => () => {
      if (s.sel === null) return this.setState({ note: 'Tap a square first.' });
      if (PUZ[s.sel] !== 0) return this.setState({ note: 'That number is part of the puzzle.' });
      const v = s.v.slice(); v[s.sel] = n; this.setState({ v: v, note: '' });
    };
    return {
      cells: cells, done: done,
      pad: [1, 2, 3, 4].map((n) => ({ text: String(n), label: 'Enter ' + n, press: put(n) })).concat([{ text: '⌫', label: 'Erase', press: put(0) }]),
      message: s.note || (done ? '' : 'Clashing numbers are underlined as you go.')
    };
  }
}
</script>
</body>
</html>
