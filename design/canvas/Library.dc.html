<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then Again: Puzzle library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#141210}a:hover{color:#2340C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #141210; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 18px 20px 4px; display: flex; justify-content: space-between; align-items: flex-end">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.03em; line-height: 1">Library</h1>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.06em">{{countLine}}</span>
  </div>
  <div style="padding: 12px 16px 0">
    <label for="libsearch" style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; margin: 0 4px 6px">SEARCH PUZZLES</label>
    <input id="libsearch" type="search" value="{{query}}" onChange="{{onQuery}}" placeholder="Try “sudoku” or “words”" style="width: 100%; box-sizing: border-box; min-height: 48px; border-radius: 12px; border: 2px solid #141210; background: #FFFFFF; padding: 0 14px; font-family: Figtree, sans-serif; font-size: 16px; color: #141210">
  </div>
  <div role="group" aria-label="Filter by puzzle family" style="display: flex; gap: 8px; padding: 12px 16px 6px; flex-wrap: wrap">
    <sc-for list="{{chips}}" as="ch" hint-placeholder-count="5">
      <button onClick="{{ch.pick}}" aria-pressed="{{ch.on}}" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid {{ch.edge}}; background: {{ch.bg}}; color: {{ch.fg}}; font-family: Figtree, sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">{{ch.label}}</button>
    </sc-for>
  </div>
  <div style="flex-grow: 1; overflow-y: auto; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
      <sc-if value="{{c.live}}" hint-placeholder-val="{{ true }}">
        <a href="{{c.href}}" style="text-decoration: none; border-radius: 16px; background: {{c.bg}}; color: {{c.fg}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">{{c.kicker}}</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.05">{{c.name}}</span>
          <span style="font-size: 15px; line-height: 1.35">{{c.desc}}</span>
          <span style="font-size: 14px; font-weight: 700; margin-top: 4px">{{c.meta}} <span aria-hidden="true">→</span></span>
        </a>
      </sc-if>
      <sc-if value="{{c.soon}}" hint-placeholder-val="{{ false }}">
        <div style="border-radius: 16px; border: 2px dashed {{c.edge}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; color: #55504A">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">{{c.kicker}} · COMING SOON</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.05; color: #141210">{{c.name}}</span>
          <span style="font-size: 15px; line-height: 1.35">{{c.desc}}</span>
        </div>
      </sc-if>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <p style="text-align: center; color: #55504A; margin: 30px 0">No puzzles match that search.</p>
    </sc-if>
    <a href="Catalogue.dc.html" style="min-height: 52px; border-radius: 14px; background: #141210; color: #F7F6F2; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">See all 190+ planned puzzles →</a>
  </div>
  <nav aria-label="Main" style="margin: 0 12px 14px; padding: 6px; border-radius: 22px; background: #141210; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <a href="Main.dc.html" style="min-height: 52px; border-radius: 16px; color: #C9C5BD; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"></path></svg>Today</a>
    <a href="Library.dc.html" aria-current="page" style="min-height: 52px; border-radius: 16px; background: #E8552B; color: #141210; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h6v14H4zM14 5h6v14h-6z"></path></svg>Library</a>
    <a href="Themes.dc.html" style="min-height: 52px; border-radius: 16px; color: #C9C5BD; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4-8 4-8-4 8-4zM4 12l8 4 8-4M4 17l8 4 8-4"></path></svg>Themes</a>
    <a href="Collection.dc.html" style="min-height: 52px; border-radius: 16px; color: #C9C5BD; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Collection</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fam: 'all', q: '' };
  }
  renderVals() {
    const F = {
      word: { label: 'Words', kicker: 'WORD GAMES', bg: '#E8552B', fg: '#141210', edge: '#E8552B' },
      search: { label: 'Search', kicker: 'SEARCH', bg: '#D9EC4C', fg: '#141210', edge: '#9BB21F' },
      logic: { label: 'Logic', kicker: 'NUMBERS & LOGIC', bg: '#2340C4', fg: '#FFFFFF', edge: '#2340C4' },
      connect: { label: 'Trivia & more', kicker: 'TRIVIA & CONNECTIONS', bg: '#BFAEF5', fg: '#141210', edge: '#8C76E0' }
    };
    const all = [
      { name: 'Word Guess', fam: 'word', desc: 'Find the hidden five-letter word in six tries.', meta: '3 min · Easy · Played today', href: 'WordGuess.dc.html', live: true },
      { name: 'Word Search', fam: 'search', desc: 'Find six themed words hidden in the grid.', meta: '5 min · Easy · New today', href: 'WordSearch.dc.html', live: true },
      { name: 'Sudoku', fam: 'logic', desc: 'Every row, column and box holds 1 to 9 once.', meta: '10 min · Medium · New today', href: 'Sudoku.dc.html', live: true },
      { name: 'Rewind', fam: 'connect', desc: 'Sort sixteen familiar things into four groups.', meta: '4 min · Medium · New today', href: 'Rewind.dc.html', live: true },
      { name: 'Circle Word Finder', fam: 'word', desc: 'Make words from seven letters around a circle.', meta: '5 min · Easy · New', href: 'CircleWord.dc.html', live: true },
      { name: 'Mini Crossword', fam: 'word', desc: 'A four-by-four crossword that reads both ways.', meta: '3 min · Easy · New', href: 'MiniCrossword.dc.html', live: true },
      { name: 'Nonogram', fam: 'logic', desc: 'Fill squares from number clues to reveal a picture.', meta: '5 min · Medium · New', href: 'Nonogram.dc.html', live: true },
      { name: 'Daily Bingo', fam: 'connect', desc: 'Mark called objects and complete a line.', meta: '4 min · Easy · New', href: 'Bingo.dc.html', live: true },
      { name: 'Mystery Object', fam: 'connect', desc: 'Name the everyday object in as few clues as you can.', meta: '3 min · Medium · New', href: 'MysteryObject.dc.html', live: true },
      { name: 'The Quiz', fam: 'connect', desc: 'Five questions, one at a time.', meta: '3 min · Easy · New', href: 'Quiz.dc.html', live: true },
      { name: 'Word Ladder', fam: 'word', desc: 'Turn one word into another, a letter at a time.', meta: '3 min · Medium · New', href: 'WordLadder.dc.html', live: true },
      { name: 'Mini Sudoku', fam: 'logic', desc: 'A quick 4×4 grid for a short break.', meta: '2 min · Easy · New', href: 'MiniSudoku.dc.html', live: true },
      { name: 'Minesweeper', fam: 'logic', desc: 'Uncover every safe square using the number clues.', meta: '4 min · Medium · New', href: 'Minesweeper.dc.html', live: true },
      { name: 'Higher or Lower', fam: 'connect', desc: 'Guess whether the next number goes up or down.', meta: '2 min · Easy · New', href: 'HigherLower.dc.html', live: true },
      { name: 'Picture Search', fam: 'search', desc: 'Spot the hidden objects in a busy scene.', live: false },
      { name: '4×4 Logic', fam: 'logic', desc: 'Work out who had which treat from four clues.', meta: '3 min · Easy · New', href: 'LogicGrid.dc.html', live: true },
      { name: 'Anagrams', fam: 'word', desc: 'Unscramble five everyday things.', meta: '3 min · Easy · New', href: 'Anagrams.dc.html', live: true },
      { name: 'Word Hive', fam: 'word', desc: 'Make words from seven letters, always using the centre.', meta: '6 min · Medium · New', href: 'WordHive.dc.html', live: true },
      { name: 'Killer Sudoku', fam: 'logic', desc: 'No starting numbers, just cages that must add up.', meta: '5 min · Medium · New', href: 'KillerSudoku.dc.html', live: true },
      { name: 'Kakuro', fam: 'logic', desc: 'A crossword made of sums.', meta: '4 min · Medium · New', href: 'Kakuro.dc.html', live: true },
      { name: 'Futoshiki', fam: 'logic', desc: 'Fill the grid so every greater-than sign holds.', meta: '5 min · Medium · New', href: 'Futoshiki.dc.html', live: true },
      { name: 'Sliding Tile', fam: 'logic', desc: 'Slide the numbers back into order.', meta: '3 min · Easy · New', href: 'SlidingTile.dc.html', live: true },
      { name: 'Put It in Order', fam: 'connect', desc: 'Arrange five steps from first to last.', meta: '2 min · Easy · New', href: 'PutInOrder.dc.html', live: true }
    ];
    const q = this.state.q.trim().toLowerCase();
    const shown = all.filter((c) => (this.state.fam === 'all' || c.fam === this.state.fam) && (!q || (c.name + ' ' + c.desc + ' ' + F[c.fam].label).toLowerCase().includes(q)));
    const cards = shown.map((c) => ({ name: c.name, desc: c.desc, meta: c.meta || '', href: c.href || '', live: c.live, soon: !c.live, kicker: F[c.fam].kicker, bg: F[c.fam].bg, fg: F[c.fam].fg, edge: F[c.fam].edge }));
    const chips = [['all', 'All', '#141210', '#F7F6F2']].concat(Object.keys(F).map((k) => [k, F[k].label, F[k].edge, F[k].fg])).map(([k, label, color, fg]) => {
      const on = this.state.fam === k;
      return { label: label, on: on ? 'true' : 'false', edge: on ? color : '#CFCBC2', bg: on ? (k === 'all' ? '#141210' : F[k].bg) : '#FFFFFF', fg: on ? (k === 'all' ? '#F7F6F2' : F[k].fg) : '#141210', pick: () => this.setState({ fam: k }) };
    });
    return {
      chips: chips,
      cards: cards,
      empty: cards.length === 0,
      query: this.state.q,
      onQuery: (e) => this.setState({ q: e.target.value }),
      countLine: shown.filter((c) => c.live).length + ' PLAYABLE'
    };
  }
}
</script>
</body>
</html>
