<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then Again: Nonogram</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#141210}a:hover{color:#2340C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #141210; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 10px">
    <a href="Library.dc.html" aria-label="Back to the library" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #141210; display: grid; place-items: center; text-decoration: none; font-size: 20px; font-weight: 700">←</a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">NUMBERS &amp; LOGIC · Nº 023</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.02em">Nonogram</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; background: #2340C4; color: #FFFFFF; border-radius: 10px; padding: 6px 10px">5×5</span>
  </div>
  <p style="margin: 0 20px 14px; font-size: 15px; color: #55504A; line-height: 1.4">The numbers tell you how many squares in a row are filled, in order. Fill the right squares to reveal a picture.</p>
  <div style="display: grid; grid-template-columns: 70px repeat(5, 56px); grid-template-rows: 70px repeat(5, 56px); gap: 4px; justify-content: center">
    <span></span>
    <sc-for list="{{colClues}}" as="cc" hint-placeholder-count="5">
      <span style="display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 17px; line-height: 1.3; white-space: pre-line; color: {{cc.color}}">{{cc.text}}</span>
    </sc-for>
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
      <span style="display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 17px; color: {{row.color}}">{{row.clue}}</span>
      <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="5">
        <button onClick="{{c.tap}}" aria-label="{{c.label}}" style="border-radius: 8px; border: 2px solid #141210; background: {{c.bg}}; color: #8A857D; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 22px; padding: 0; cursor: pointer">{{c.mark}}</button>
      </sc-for>
    </sc-for>
  </div>
  <div role="group" aria-label="Tap mode" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 18px 16px 0; padding: 4px; border-radius: 16px; background: #E9E6DF">
    <button onClick="{{modeFill}}" aria-pressed="{{fillOn}}" style="min-height: 48px; border-radius: 12px; border: 0; background: {{fillBg}}; color: {{fillFg}}; font-family: Figtree, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">■ Fill</button>
    <button onClick="{{modeMark}}" aria-pressed="{{markOn}}" style="min-height: 48px; border-radius: 12px; border: 0; background: {{markBg}}; color: {{markFg}}; font-family: Figtree, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">× Mark empty</button>
  </div>
  <div aria-live="polite" style="min-height: 22px; padding: 10px 20px 0; font-size: 15px; font-weight: 600; text-align: center">{{message}}</div>
  <sc-if value="{{solved}}" hint-placeholder-val="{{ false }}">
    <div style="margin: auto 16px 16px; border-radius: 18px; background: #2340C4; color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em">PICTURE REVEALED</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.05">A heart, carved into a school desk.</span>
      <a href="Library.dc.html" style="min-height: 50px; border-radius: 12px; background: #D9EC4C; color: #141210; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">Back to the library →</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { g: Array(25).fill(0), mode: 'fill' };
  }
  renderVals() {
    const SOL = '0101011111111110111000100'.split('').map(Number);
    const s = this.state;
    const runs = (arr) => { const out = []; let n = 0; arr.forEach((x) => { if (x === 1) n++; else if (n) { out.push(n); n = 0; } }); if (n) out.push(n); return out.length ? out : [0]; };
    const filled = s.g.map((x) => (x === 1 ? 1 : 0));
    const solved = filled.every((x, i) => x === SOL[i]);
    const rowOf = (arr, r) => arr.slice(r * 5, r * 5 + 5), colOf = (arr, c) => [0, 1, 2, 3, 4].map((r) => arr[r * 5 + c]);
    const same = (a, b) => a.join(',') === b.join(',');
    const rows = [0, 1, 2, 3, 4].map((r) => ({
      clue: runs(rowOf(SOL, r)).join(' '),
      color: same(runs(rowOf(filled, r)), runs(rowOf(SOL, r))) ? '#9BB21F' : '#141210',
      cells: [0, 1, 2, 3, 4].map((c) => {
        const i = r * 5 + c, st = s.g[i];
        return {
          bg: st === 1 ? '#2340C4' : '#FFFFFF', mark: st === 2 ? '×' : '',
          label: 'Row ' + (r + 1) + ', column ' + (c + 1) + ', ' + (st === 1 ? 'filled' : st === 2 ? 'marked empty' : 'blank'),
          tap: () => { if (solved) return; const g = s.g.slice(); const want = s.mode === 'fill' ? 1 : 2; g[i] = g[i] === want ? 0 : want; this.setState({ g: g }); }
        };
      })
    }));
    const colClues = [0, 1, 2, 3, 4].map((c) => ({ text: runs(colOf(SOL, c)).join('\n'), color: same(runs(colOf(filled, c)), runs(colOf(SOL, c))) ? '#9BB21F' : '#141210' }));
    const fill = s.mode === 'fill';
    return {
      rows: rows, colClues: colClues, solved: solved,
      message: solved ? '' : 'A clue turns green when its row or column matches.',
      fillOn: fill ? 'true' : 'false', markOn: fill ? 'false' : 'true',
      fillBg: fill ? '#141210' : 'transparent', fillFg: fill ? '#F7F6F2' : '#141210',
      markBg: fill ? 'transparent' : '#141210', markFg: fill ? '#141210' : '#F7F6F2',
      modeFill: () => this.setState({ mode: 'fill' }), modeMark: () => this.setState({ mode: 'mark' })
    };
  }
}
</script>
</body>
</html>
