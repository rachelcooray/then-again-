<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then Again: Put It in Order</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#141210}a:hover{color:#2340C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #141210; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 10px">
    <a href="Library.dc.html" aria-label="Back to the library" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #141210; display: grid; place-items: center; text-decoration: none; font-size: 20px; font-weight: 700">←</a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">TRIVIA · Nº 023</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.02em">Put It in Order</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; background: #BFAEF5; border-radius: 10px; padding: 6px 10px">{{checksLine}}</span>
  </div>
  <div style="margin: 0 16px 12px; border-radius: 16px; background: #141210; color: #F7F6F2; padding: 14px 16px">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1">A letter’s journey</span>
    <p style="margin: 6px 0 0; font-size: 15px; color: #C9C5BD; line-height: 1.4">Put these five steps in order, from first to last. Use the arrows to move them.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 64px; border-radius: 14px; border: 2px solid #141210; background: {{c.bg}}; padding: 6px 8px 6px 12px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; width: 22px">{{c.n}}</span>
        <span style="flex-grow: 1; font-weight: 600; font-size: 16px; line-height: 1.3">{{c.text}}</span>
        <button onClick="{{c.up}}" aria-label="{{c.upLabel}}" disabled="{{c.first}}" style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #141210; background: #FFFFFF; color: #141210; font-size: 18px; cursor: pointer; opacity: {{c.upOp}}">↑</button>
        <button onClick="{{c.down}}" aria-label="{{c.downLabel}}" disabled="{{c.last}}" style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #141210; background: #FFFFFF; color: #141210; font-size: 18px; cursor: pointer; opacity: {{c.downOp}}">↓</button>
      </div>
    </sc-for>
  </div>
  <div aria-live="polite" style="min-height: 22px; padding: 12px 20px 0; font-size: 15px; font-weight: 600; text-align: center">{{message}}</div>
  <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
    <button onClick="{{check}}" style="margin: auto 16px 16px; min-height: 56px; border-radius: 14px; border: 0; background: #141210; color: #F7F6F2; font-family: Figtree, sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">Check the order</button>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="margin: auto 16px 16px; border-radius: 18px; background: #BFAEF5; padding: 18px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.05">{{doneTitle}}</span>
      <a href="Library.dc.html" style="min-height: 50px; border-radius: 12px; background: #141210; color: #F7F6F2; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">Back to the library →</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { order: [2, 4, 0, 3, 1], checks: 3, solved: false, note: '' };
  }
  renderVals() {
    const STEPS = ['You drop it in the postbox', 'The postman collects it', 'It’s sorted at the sorting office', 'It travels to the right town', 'It’s delivered through the door'];
    const s = this.state;
    const done = s.solved || s.checks === 0;
    const shown = done ? [0, 1, 2, 3, 4] : s.order;
    const move = (k, d) => () => { const o = s.order.slice(); const j = k + d; if (j < 0 || j > 4) return; [o[k], o[j]] = [o[j], o[k]]; this.setState({ order: o, note: '' }); };
    const cards = shown.map((step, k) => ({
      n: String(k + 1), text: STEPS[step],
      bg: done ? '#D9EC4C' : '#FFFFFF',
      first: done || k === 0, last: done || k === 4,
      upOp: done || k === 0 ? '0.3' : '1', downOp: done || k === 4 ? '0.3' : '1',
      upLabel: 'Move “' + STEPS[step] + '” up', downLabel: 'Move “' + STEPS[step] + '” down',
      up: move(k, -1), down: move(k, 1)
    }));
    return {
      cards: cards, done: done, playing: !done,
      checksLine: s.checks + ' CHECKS',
      message: s.note,
      doneTitle: s.solved ? 'Signed, sealed, delivered.' : 'Here’s the right order.',
      check: () => {
        const right = s.order.filter((step, k) => step === k).length;
        if (right === 5) return this.setState({ solved: true, note: '' });
        this.setState({ checks: s.checks - 1, note: right + ' of 5 are in the right place.' });
      }
    };
  }
}
</script>
</body>
</html>
