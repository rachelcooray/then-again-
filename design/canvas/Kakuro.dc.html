<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then Again: Kakuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#141210}a:hover{color:#2340C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #141210; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 10px">
    <a href="Library.dc.html" aria-label="Back to the library" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #141210; display: grid; place-items: center; text-decoration: none; font-size: 20px; font-weight: 700">←</a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">NUMBERS &amp; LOGIC · Nº 023</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.02em">Kakuro</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; background: #2340C4; color: #FFFFFF; border-radius: 10px; padding: 6px 10px">3×3</span>
  </div>
  <p style="margin: 0 20px 14px; font-size: 15px; color: #55504A; line-height: 1.4">Fill the white squares with 1 to 9. Each row adds up to the number on its left, each column to the number above it, and no digit repeats within a row or column.</p>
  <div role="grid" aria-label="Kakuro grid" style="width: 300px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="16">
      <sc-if value="{{c.clue}}" hint-placeholder-val="{{ false }}">
        <div aria-label="{{c.label}}" style="aspect-ratio: 1; border-radius: 10px; background: #141210; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 18px">{{c.text}}</div>
      </sc-if>
      <sc-if value="{{c.cell}}" hint-placeholder-val="{{ true }}">
        <button onClick="{{c.tap}}" aria-label="{{c.label}}" style="aspect-ratio: 1; border-radius: 10px; border: 2px solid #141210; background: {{c.bg}}; color: #2340C4; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 30px; padding: 0; cursor: pointer">{{c.text}}</button>
      </sc-if>
    </sc-for>
  </div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 18px 16px 0">
    <sc-for list="{{pad}}" as="p" hint-placeholder-count="10">
      <button onClick="{{p.press}}" aria-label="{{p.label}}" style="min-height: 52px; border-radius: 12px; border: 2px solid #141210; background: #FFFFFF; color: #141210; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 20px; cursor: pointer">{{p.text}}</button>
    </sc-for>
  </div>
  <div aria-live="polite" style="min-height: 22px; padding: 12px 20px 0; font-size: 15px; font-weight: 600; text-align: center">{{message}}</div>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="margin: auto 16px 16px; border-radius: 18px; background: #2340C4; color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.05">All the sums add up.</span>
      <a href="Library.dc.html" style="min-height: 50px; border-radius: 12px; background: #D9EC4C; color: #141210; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">Back to the library →</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: Array(9).fill(0), sel: null, note: '' };
  }
  renderVals() {
    const SOL = [7, 2, 1, 8, 1, 3, 9, 4, 7];
    const ROWS = [10, 12, 20], COLS = [24, 7, 11];
    const s = this.state;
    const done = s.v.every((x, i) => x === SOL[i]);
    const rowOk = (r) => { const a = s.v.slice(r * 3, r * 3 + 3); return a.every(Boolean) && a.reduce((x, y) => x + y, 0) === ROWS[r] && new Set(a).size === 3; };
    const colOk = (c) => { const a = [0, 1, 2].map((r) => s.v[r * 3 + c]); return a.every(Boolean) && a.reduce((x, y) => x + y, 0) === COLS[c] && new Set(a).size === 3; };
    const cells = [];
    for (let R = 0; R < 4; R++) for (let C = 0; C < 4; C++) {
      if (R === 0 && C === 0) { cells.push({ clue: true, cell: false, text: '', fg: '#F7F6F2', label: 'Blank corner' }); continue; }
      if (R === 0) { const ok = colOk(C - 1); cells.push({ clue: true, cell: false, text: (ok ? '✓' : '') + COLS[C - 1] + '↓', fg: ok ? '#D9EC4C' : '#F7F6F2', label: 'Column ' + C + ' adds up to ' + COLS[C - 1] }); continue; }
      if (C === 0) { const ok = rowOk(R - 1); cells.push({ clue: true, cell: false, text: (ok ? '✓' : '') + ROWS[R - 1] + '→', fg: ok ? '#D9EC4C' : '#F7F6F2', label: 'Row ' + R + ' adds up to ' + ROWS[R - 1] }); continue; }
      const i = (R - 1) * 3 + (C - 1);
      cells.push({ clue: false, cell: true, text: s.v[i] || '', bg: s.sel === i ? '#D9EC4C' : '#FFFFFF', label: 'Row ' + R + ', column ' + C + ', ' + (s.v[i] || 'empty'), tap: () => this.setState({ sel: i, note: '' }) });
    }
    const put = (n) => () => {
      if (s.sel === null) return this.setState({ note: 'Tap a white square first.' });
      const v = s.v.slice(); v[s.sel] = n; this.setState({ v: v, note: '' });
    };
    return {
      cells: cells, done: done,
      pad: [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({ text: String(n), label: 'Enter ' + n, press: put(n) })).concat([{ text: '⌫', label: 'Erase', press: put(0) }]),
      message: s.note || (done ? '' : 'Tip: 24 down can only be 7, 8 and 9.')
    };
  }
}
</script>
</body>
</html>
