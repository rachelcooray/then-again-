<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then Again: Killer Sudoku</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#141210}a:hover{color:#2340C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #141210; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 10px">
    <a href="Library.dc.html" aria-label="Back to the library" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #141210; display: grid; place-items: center; text-decoration: none; font-size: 20px; font-weight: 700">←</a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">NUMBERS &amp; LOGIC · Nº 023</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.02em">Killer Sudoku</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; background: #2340C4; color: #FFFFFF; border-radius: 10px; padding: 6px 10px">4×4</span>
  </div>
  <p style="margin: 0 20px 14px; font-size: 15px; color: #55504A; line-height: 1.4">No numbers to start with. Each dashed cage adds up to its small number, with no repeats. Rows, columns and 2×2 boxes use 1 to 4 once.</p>
  <div role="grid" aria-label="Killer Sudoku grid" style="width: 300px; margin: 0 auto; border: 3px solid #141210; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="16">
      <button onClick="{{c.tap}}" aria-label="{{c.label}}" style="position: relative; aspect-ratio: 1; border-right: {{c.gr}}; border-bottom: {{c.gb}}; border-top: 0; border-left: 0; background: {{c.bg}}; color: {{c.fg}}; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 32px; padding: 0; cursor: pointer; text-decoration: {{c.deco}}">
        <span aria-hidden="true" style="position: absolute; inset: 5px; border-top: {{c.ct}}; border-right: {{c.cr}}; border-bottom: {{c.cb}}; border-left: {{c.cl}}; pointer-events: none"></span>
        <span aria-hidden="true" style="position: absolute; top: 7px; left: 9px; font-size: 12px; font-family: Figtree, sans-serif; font-weight: 700; color: #2340C4">{{c.sum}}</span>{{c.v}}
      </button>
    </sc-for>
  </div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 20px 16px 0">
    <sc-for list="{{pad}}" as="p" hint-placeholder-count="5">
      <button onClick="{{p.press}}" aria-label="{{p.label}}" style="min-height: 60px; border-radius: 14px; border: 2px solid #141210; background: #FFFFFF; color: #141210; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 24px; cursor: pointer">{{p.text}}</button>
    </sc-for>
  </div>
  <div aria-live="polite" style="min-height: 22px; padding: 14px 20px 0; font-size: 15px; font-weight: 600; text-align: center">{{message}}</div>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="margin: auto 16px 16px; border-radius: 18px; background: #2340C4; color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.05">Every cage adds up.</span>
      <a href="Library.dc.html" style="min-height: 50px; border-radius: 12px; background: #D9EC4C; color: #141210; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">Back to the library →</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: Array(16).fill(0), sel: null, note: '' };
  }
  renderVals() {
    const SOL = [1, 2, 3, 4, 3, 4, 1, 2, 2, 1, 4, 3, 4, 3, 2, 1];
    const CAGES = [[[0, 1], 3], [[2, 3, 7], 9], [[4, 8], 5], [[5, 6], 5], [[9, 13], 4], [[10, 14, 15], 7], [[11], 3], [[12], 4]];
    const cageOf = (i) => CAGES.findIndex(([cs]) => cs.includes(i));
    const s = this.state;
    const done = s.v.every((x, i) => x === SOL[i]);
    const dash = '2px dashed #2340C4';
    const badCage = (k) => { const [cs, sum] = CAGES[k]; const vals = cs.map((i) => s.v[i]); const tot = vals.reduce((a, b) => a + b, 0); const filled = vals.every(Boolean); return (filled && tot !== sum) || tot > sum || new Set(vals.filter(Boolean)).size !== vals.filter(Boolean).length; };
    const cells = s.v.map((x, i) => {
      const r = Math.floor(i / 4), c = i % 4, k = cageOf(i), first = CAGES[k][0][0] === i;
      const same = (j) => j >= 0 && j < 16 && cageOf(j) === k;
      const bad = x && badCage(k);
      return {
        v: x || '', sum: first ? String(CAGES[k][1]) : '',
        bg: s.sel === i ? '#D9EC4C' : (k % 2 ? '#F1F3FB' : '#FFFFFF'),
        fg: bad ? '#B3261E' : '#2340C4', deco: bad ? 'underline wavy #B3261E' : 'none',
        gr: c === 3 ? '0' : (c === 1 ? '3px solid #141210' : '1px solid #D8D5CE'),
        gb: r === 3 ? '0' : (r === 1 ? '3px solid #141210' : '1px solid #D8D5CE'),
        ct: r > 0 && same(i - 4) ? '0' : dash, cb: r < 3 && same(i + 4) ? '0' : dash,
        cl: c > 0 && same(i - 1) ? '0' : dash, cr: c < 3 && same(i + 1) ? '0' : dash,
        label: 'Row ' + (r + 1) + ', column ' + (c + 1) + ', ' + (x || 'empty') + ', cage totals ' + CAGES[k][1] + (bad ? ', cage does not add up' : ''),
        tap: () => this.setState({ sel: i, note: '' })
      };
    });
    const put = (n) => () => {
      if (s.sel === null) return this.setState({ note: 'Tap a square first.' });
      const v = s.v.slice(); v[s.sel] = n; this.setState({ v: v, note: '' });
    };
    return {
      cells: cells, done: done,
      pad: [1, 2, 3, 4].map((n) => ({ text: String(n), label: 'Enter ' + n, press: put(n) })).concat([{ text: '⌫', label: 'Erase', press: put(0) }]),
      message: s.note || (done ? '' : 'Tip: the single-square cages give you a free start.')
    };
  }
}
</script>
</body>
</html>
