<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then Again: Anagrams</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#141210}a:hover{color:#2340C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F2; color: #141210; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 10px">
    <a href="Library.dc.html" aria-label="Back to the library" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #141210; display: grid; place-items: center; text-decoration: none; font-size: 20px; font-weight: 700">←</a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">WORD GAMES · Nº 023</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.02em">Anagrams</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; background: #E8552B; border-radius: 10px; padding: 6px 10px">{{roundLine}}</span>
  </div>
  <p style="margin: 0 20px 14px; font-size: 15px; color: #55504A; line-height: 1.4">Unscramble five things you might find at home. Tap the letters, or type.</p>
  <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
    <div style="margin: 0 16px; border-radius: 20px; background: #E8552B; padding: 18px; display: flex; flex-direction: column; gap: 12px; align-items: center">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em">{{clue}}</span>
      <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: center">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="7">
          <button onClick="{{t.tap}}" aria-label="{{t.label}}" style="width: 42px; height: 50px; border-radius: 10px; border: 2px solid #141210; background: {{t.bg}}; color: #141210; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 22px; padding: 0; cursor: pointer; opacity: {{t.op}}">{{t.ch}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; gap: 8px; padding: 14px 16px 0">
      <label for="ana" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Your answer</label>
      <input id="ana" value="{{typed}}" onChange="{{onType}}" placeholder="Your answer" style="flex-grow: 1; min-width: 0; min-height: 52px; border-radius: 12px; border: 2px solid #141210; background: #FFFFFF; padding: 0 14px; font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #141210">
      <button onClick="{{submit}}" style="min-height: 52px; padding: 0 18px; border-radius: 12px; border: 0; background: #141210; color: #F7F6F2; font-family: Figtree, sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">Check</button>
    </div>
    <div style="display: flex; gap: 8px; padding: 10px 16px 0">
      <button onClick="{{clear}}" style="flex: 1; min-height: 46px; border-radius: 12px; border: 2px solid #141210; background: transparent; color: #141210; font-family: Figtree, sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">Clear</button>
      <button onClick="{{hint}}" style="flex: 1; min-height: 46px; border-radius: 12px; border: 2px solid #141210; background: transparent; color: #141210; font-family: Figtree, sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">Hint: first letter</button>
      <button onClick="{{skip}}" style="flex: 1; min-height: 46px; border-radius: 12px; border: 2px solid #141210; background: transparent; color: #141210; font-family: Figtree, sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">Skip</button>
    </div>
  </sc-if>
  <div aria-live="polite" style="min-height: 22px; padding: 12px 20px 0; font-size: 15px; font-weight: 600; text-align: center">{{message}}</div>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="margin: auto 16px 16px; border-radius: 18px; background: #E8552B; padding: 18px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1">{{final}}</span>
      <span style="font-size: 15px">RADIO · KETTLE · BICYCLE · TEAPOT · COMPASS</span>
      <a href="Library.dc.html" style="min-height: 50px; border-radius: 12px; background: #141210; color: #F7F6F2; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">Back to the library →</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, typed: '', used: [], right: 0, note: '' };
  }
  renderVals() {
    const ROUNDS = [['OIDRA', 'RADIO', 'IT PLAYED IN THE KITCHEN'], ['TLEKET', 'KETTLE', 'IT WHISTLED ON THE STOVE'], ['CLEBYCI', 'BICYCLE', 'IT HAD A BELL AND A PUMP'], ['POETTA', 'TEAPOT', 'IT WORE A KNITTED COSY'], ['SPOCSAM', 'COMPASS', 'IT ALWAYS POINTED NORTH']];
    const s = this.state;
    const done = s.i >= ROUNDS.length;
    const cur = ROUNDS[Math.min(s.i, ROUNDS.length - 1)];
    const advance = (got, msg) => this.setState({ i: s.i + 1, typed: '', used: [], right: s.right + (got ? 1 : 0), note: msg });
    const tiles = cur[0].split('').map((ch, k) => {
      const used = s.used.includes(k);
      return { ch: ch, label: ch + (used ? ', used' : ''), bg: used ? '#E9E6DF' : '#F7F6F2', op: used ? '0.4' : '1',
        tap: () => { if (!used) this.setState({ typed: s.typed + ch, used: s.used.concat([k]), note: '' }); } };
    });
    return {
      tiles: tiles, playing: !done, done: done,
      clue: cur[2], typed: s.typed, message: s.note,
      roundLine: Math.min(s.i + 1, 5) + '/5',
      final: s.right + ' of 5 unscrambled',
      onType: (e) => this.setState({ typed: e.target.value.toUpperCase().replace(/[^A-Z]/g, ''), used: [], note: '' }),
      clear: () => this.setState({ typed: '', used: [], note: '' }),
      hint: () => this.setState({ note: 'It starts with ' + cur[1][0] + '.' }),
      skip: () => advance(false, 'It was ' + cur[1] + '.'),
      submit: () => {
        if (s.typed === cur[1]) return advance(true, '✓ ' + cur[1] + '!');
        this.setState({ note: 'Not quite. Try another order.' });
      }
    };
  }
}
</script>
</body>
</html>
